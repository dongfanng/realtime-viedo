<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Lucy Realtime → 微信 (fal.ai)</title>
  <style>
    :root {
      --panel-bg: rgba(15, 17, 22, 0.86);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #4c8dff;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --stage-w: 360px;
      --stage-h: 640px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    video { background: #000; }

    /* 固定像素舞台：与微信/OBS 画布一致，屏幕采集时只采这块区域 */
    #stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--stage-w);
      height: var(--stage-h);
      background: #000;
      overflow: hidden;
      z-index: 0;
      outline: 1px solid rgba(255,255,255,0.12);
    }
    body.pure #stage {
      /* 保持固定像素，不随全屏显示器变成 16:9 */
      outline: none;
      width: var(--stage-w);
      height: var(--stage-h);
    }
    /* 非纯净时显示舞台边框，方便在 OBS 里对照裁切标题栏 */
    body:not(.pure) #stage {
      outline: 2px solid var(--accent);
    }

    #output {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      opacity: 0;
      pointer-events: none;
    }

    #outputCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    /* 原始画面小窗预览（镜像），纯净模式下隐藏 */
    #preview {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 200px;
      height: 112px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      transform: scaleX(-1);
      z-index: 2;
      opacity: 0.9;
    }

    #statusPill {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 3;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(0,0,0,0.55);
      border: 1px solid var(--border);
    }
    #statusPill.ok  { color: var(--ok); }
    #statusPill.warn { color: var(--warn); }
    #statusPill.err  { color: var(--err); }

    #panel {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 3;
      width: min(680px, calc(100vw - 32px));
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 120px; }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,0.16); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { filter: brightness(1.1); }
    button.danger { background: #dc2626; border-color: #dc2626; }

    .chip {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: #d4d4d8;
      cursor: pointer;
    }
    .chip:hover { color: #fff; border-color: var(--accent); }

    label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #d4d4d8; cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

    .hint { font-size: 11px; color: #9ca3af; }
    .refname { font-size: 11px; color: var(--ok); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #pureModeBtn.on { background: #16a34a; border-color: #16a34a; }

    .title { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="output" autoplay muted playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>
  <video id="preview" autoplay muted playsinline></video>

  <div id="statusPill" class="warn">未连接</div>

  <div id="panel">
    <div class="row">
      <span class="title">fal.ai API Key</span>
      <input type="password" id="apiKey" class="grow" placeholder="fal.ai 的 Key（格式 xxxx:xxxx，仅保存在本机）" />
      <button class="primary" id="connectBtn">连接</button>
      <button id="pureModeBtn">纯净模式</button>
    </div>

    <div class="row">
      <input type="text" id="promptInput" class="grow" placeholder="编辑指令，例如：Change the background to a sandy beach with clear blue water." />
      <label class="chk"><input type="checkbox" id="enhance" checked /> enhance</label>
      <label class="chk" title="把摄像头画面按所选比例裁剪后发给模型（改后需重新连接）"><input type="checkbox" id="portrait" checked /> 按比例裁剪</label>
      <label class="chk" title="裁剪缩放：0=完整显示原画面（上下有黑边），100=裁满竖屏（放大）">
        裁剪缩放<input type="range" id="zoom" min="0" max="100" value="55" style="width:110px" />
      </label>
      <label class="chk" title="舞台/发送像素。微信视频约 360×640，OBS 画布请设为相同像素（改后需重新连接）">比例
        <select id="aspect" style="background:rgba(255,255,255,0.07);color:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12px;">
          <option value="9:16" selected>9:16 · 360×640 微信</option>
          <option value="9:16@720">9:16 · 720×1280</option>
          <option value="3:4">3:4 · 720×960</option>
          <option value="4:5">4:5 · 720×900</option>
          <option value="1:1">1:1 · 720×720</option>
          <option value="4:3">4:3 · 960×720</option>
          <option value="16:9">16:9 · 1280×720</option>
        </select>
      </label>
      <button type="button" id="copySizeBtn" title="复制当前舞台像素到剪贴板，方便设 OBS 画布">复制OBS尺寸</button>
      <label class="chk" title="参考图（换角色/换物体用，JPEG/PNG/WebP）">
        参考图<input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden />
      </label>
      <span id="refName" class="refname"></span>
      <button id="clearRefBtn" title="清除参考图，回到纯文字编辑">清除参考图</button>
      <button id="applyBtn" class="primary">应用</button>
    </div>

    <div class="row">
      <span class="chip" data-p="Substitute the character in the video with a stunningly beautiful 20-year-old female college student. Refine the face: delicate oval face with a soft jawline, big bright eyes with double eyelids and long lashes, a straight slender nose, soft rosy lips, fair smooth glowing skin. Give her long silky black hair with neat bangs (like a natural black wig), and apply a fresh light makeup look with soft glam eyes, natural blush, and glossy lips. Overall sweet, gentle, youthful college-girl charm, wearing a white T-shirt and jeans.">20岁女大学生</span>
      <span class="chip" data-p="Substitute the character in the video with the person in the reference image, matching the appearance, hairstyle, and outfit exactly." data-ref="/ali.png" data-refname="ali">ali</span>
      <span class="chip" data-p="Substitute the character in the video with the person in the reference image, matching the anime-style appearance, hairstyle, and outfit exactly." data-ref="/星穹铁道.png" data-refname="星穹铁道">星穹铁道角色</span>
      <span class="chip" data-p="Substitute the character in the video with the person in the reference image, matching the youthful, fresh and natural look, hairstyle and outfit exactly." data-ref="/vmgirl.png" data-refname="青春女生">青春女生</span>
      <span class="chip" data-p="Add a long black wig with bangs to the person's head, smooth and brighten the skin, slim the face with a soft jawline, enlarge the eyes with a delicate eye makeup, apply natural blush and glossy lip makeup for a beauty-filter look.">假发+美颜</span>
      <span class="chip" data-p="Change the wall's color to light blue, natural consistent paint finish.">换墙色</span>
      <span class="chip" data-p="Change the background to a sandy beach with clear blue water.">沙滩背景</span>
      <span class="chip" data-p="Change the background to a cyberpunk neon city street at night.">赛博朋克</span>
      <span class="chip" data-p="Change the style of the video to Studio Ghibli animation style.">吉卜力风格</span>
      <span class="chip" data-p="Add a small dog running around in the background.">加只小狗</span>
      <span class="chip" data-p="Add a red conical hat, covered in sequins, with a white fluffy trim to the person's head.">加帽子</span>
      <span class="chip" data-p="Remove the microphone stand from the scene.">移除物体</span>
    </div>

    <div class="hint">
      流程：填 API Key → 连接（页面出现变换画面）→ 填指令点"应用"。模型：decart/lucy-2-5/realtime（通用实时编辑，$0.02/秒）。
      舞台固定 360×640，不要 F11 全屏（全屏会变成显示器 16:9）。按 H 纯净模式后，OBS 屏幕采集若带标题栏：选中源 → 按住 Option 拖边缘，裁到蓝色舞台框。也可用：npm run capture（Chrome 应用窗，无标签栏）。
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
